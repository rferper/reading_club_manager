name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
      - run: uv sync --locked
      - run: uv run python manage.py check
      - run: uv run python manage.py test

{% extends "club/base.html" %}

{% block title %}{{ heading }} — Reading Club Manager{% endblock %}

{% block content %}
  <h1>{{ heading }}</h1>

  <p class="byline">on {{ book.title }} by {{ book.author }}</p>

  <form class="admin-only" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{{ submit_label }}</button>
  </form>

  <p><a href="{% url 'club:questions' %}">Back to the questions</a></p>
{% endblock %}
